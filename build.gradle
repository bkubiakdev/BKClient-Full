tasks.register('remapIntermediarySources') {
    dependsOn 'genSources'

    doLast {
        def loom = LoomGradleExtension.get(project)
        def mappingsJar = configurations.mappings.singleFile
        def tinyPath = zipTree(mappingsJar).matching {
            include 'mappings/mappings.tiny', '*.tiny'
        }.singleFile.toPath()

        def tree = new MemoryMappingTree()
        MappingReader.read(tinyPath, tree)

        def mappings = new TinyMappingsReader(tree, 'intermediary', 'named').read(MappingSet.create())
        def namedMc = loom.getMinecraftJarsCollection(MappingsNamespace.NAMED)
        def intermediaryMc = loom.getMinecraftJarsCollection(MappingsNamespace.INTERMEDIARY)
        def mcLibs = configurations.getByName('minecraftLibraries')
        def remapClasspath = files(intermediaryMc, mcLibs, sourceSets.main.compileClasspath.minus(namedMc))

        def srcIn = file('src/main/java').toPath()
        def srcOut = file('build/remappedSources/main/java').toPath()

        def mercury = new Mercury()
        mercury.setGracefulClasspathChecks(true)
        mercury.setGracefulJavadocClasspathChecks(true)
        mercury.getClassPath().addAll(remapClasspath.files.collect { it.toPath() })
        mercury.getProcessors().add(MercuryRemapper.create(mappings))
        mercury.getProcessors().add(MixinRemapper.create(mappings))

        mercury.rewrite(srcIn, srcOut)
    }
}

