buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
    dependencies {
        classpath 'net.fabricmc:mercury:0.4.3'
        classpath 'net.fabricmc:mercurymixin:0.2.2'
        classpath 'net.fabricmc:mapping-io:0.8.0'
        classpath 'net.fabricmc:lorenz-tiny:4.0.2'
    }
}

plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

import net.fabricmc.mappingio.MappingReader
import net.fabricmc.mappingio.tree.MemoryMappingTree
import net.fabricmc.lorenztiny.TinyMappingsReader
import net.fabricmc.loom.LoomGradleExtension
import net.fabricmc.loom.api.mappings.layered.MappingsNamespace
import org.cadixdev.lorenz.MappingSet
import org.cadixdev.mercury.Mercury
import org.cadixdev.mercury.remapper.MercuryRemapper
import org.cadixdev.mercury.mixin.MixinRemapper

