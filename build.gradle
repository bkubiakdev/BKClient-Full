group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        client {
            runDir = project.findProperty('clientRunDir') ?: 'run'
            if (System.getProperty('os.name').startsWith('Windows')) {
                // A regular file cannot host AF_UNIX sockets. Force Java's PipeImpl
                // to use its TCP loopback fallback for Netty selectors on Windows.
                vmArg "-Djdk.net.unixdomain.tmpdir=${project.file('build.gradle').absolutePath}"
            }
        }
    }
}

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    // Optional integration, remapped for compilation only; never bundle Sodium.
    modCompileOnly "maven.modrinth:sodium:mc1.21.4-0.6.13-fabric"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "org.projectlombok:lombok:1.18.38"
    annotationProcessor "org.projectlombok:lombok:1.18.38"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "com.google.zxing:core:3.5.3"
    implementation("com.google.zxing:javase:3.5.3") {
        exclude group: 'com.github.jai-imageio', module: 'jai-imageio-core'
    }
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    // Pinned to the version Gradle already resolves to: javacv brings jna up to
    // 5.15.0 on the compile classpath, so bundling 5.7.0 shipped a jar the code was never
    // compiled against, and jna-platform 5.15.0 would call into methods it does not have.
    implementation "net.java.dev.jna:jna:5.15.0"
    include "net.java.dev.jna:jna:5.15.0"
    // jna-platform carries com.sun.jna.platform.win32 (User32, Kernel32Util), which
    // TitleBarHelper and the window embedder both need. It was only ever on the
    // compile classpath as a transitive of javacv, so the shipped jar was missing it
    // and those calls died with NoClassDefFoundError rather than a catchable Exception.
    implementation "net.java.dev.jna:jna-platform:5.15.0"
    include "net.java.dev.jna:jna-platform:5.15.0"
    // Bundle the native libraries used by the animated main-menu background.
    // (VideoBackgroundPlayer, FFmpegFrameGrabber) worked under `runClient`
    // off the dev classpath but was silently missing from the shipped jar.
    implementation "org.bytedeco:javacv:1.5.12"
    include "org.bytedeco:javacv:1.5.12"
    implementation "org.bytedeco:javacpp:1.5.12"
    include "org.bytedeco:javacpp:1.5.12"
    implementation "org.bytedeco:javacpp:1.5.12:windows-x86_64"
    include "org.bytedeco:javacpp:1.5.12:windows-x86_64"
    implementation "org.bytedeco:ffmpeg:7.1.1-1.5.12"
    include "org.bytedeco:ffmpeg:7.1.1-1.5.12"
    implementation "org.bytedeco:ffmpeg:7.1.1-1.5.12:windows-x86_64"
    include "org.bytedeco:ffmpeg:7.1.1-1.5.12:windows-x86_64"



}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

